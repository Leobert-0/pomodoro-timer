<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Tomato Gradient -->
    <radialGradient id="tomatoGrad" cx="35%" cy="30%" r="70%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="45%" stop-color="#EE5253"/>
      <stop offset="90%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#962216"/>
    </radialGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Stem & Leaves Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ED573"/>
      <stop offset="100%" stop-color="#10AC84"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Tomato Main Body with Shadow -->
  <g filter="url(#dropShadow)">
    <path d="M 256 120 
             C 330 110, 430 140, 445 235 
             C 460 330, 410 425, 335 448 
             C 285 462, 227 462, 177 448 
             C 102 425, 52 330, 67 235 
             C 82 140, 182 110, 256 120 Z" 
          fill="url(#tomatoGrad)" />
  </g>

  <!-- Tomato Highlight / Gloss Reflection -->
  <ellipse cx="200" cy="180" rx="90" ry="40" transform="rotate(-25 200 180)" fill="url(#glossGrad)"/>

  <!-- Dial / Timer Subtle Ring Markings -->
  <g opacity="0.28" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <circle cx="256" cy="290" r="95" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 10" opacity="0.4"/>
    <!-- Center Dot -->
    <circle cx="256" cy="290" r="5" fill="#FFFFFF"/>
    <!-- Timer Hand pointing to 25 min mark -->
    <line x1="256" y1="290" x2="256" y2="220" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="256" y1="290" x2="305" y2="290" stroke="#FFFFFF" stroke-width="5"/>
  </g>

  <!-- Leaves / Sepals -->
  <g fill="url(#leafGrad)">
    <!-- Left Leaf -->
    <path d="M 256 125 C 220 110, 150 100, 130 125 C 150 145, 210 145, 256 135 Z"/>
    <!-- Top-Left Leaf -->
    <path d="M 256 125 C 225 90, 185 45, 170 65 C 185 95, 225 115, 256 128 Z"/>
    <!-- Right Leaf -->
    <path d="M 256 125 C 292 110, 362 100, 382 125 C 362 145, 302 145, 256 135 Z"/>
    <!-- Top-Right Leaf -->
    <path d="M 256 125 C 287 90, 327 45, 342 65 C 327 95, 287 115, 256 128 Z"/>
    <!-- Center Leaf -->
    <path d="M 256 135 C 248 160, 240 180, 256 195 C 272 180, 264 160, 256 135 Z"/>
  </g>

  <!-- Tomato Stem -->
  <path d="M 256 130 C 254 100, 250 65, 235 45 C 238 42, 255 42, 266 52 C 275 70, 268 105, 260 130 Z" 
        fill="#10AC84"/>
</svg>
